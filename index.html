<!-- Google Translate -->
<div id="google_translate_element" style="display: none; margin-bottom: 20%;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: "en",
        includedLanguages: "en,ha,yo,ig,ff,es,fr,ar",
        autoDisplay: false,
      },
      "google_translate_element"
    );
  }
</script>

<script
  type="text/javascript"
  src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
></script>

<script>
  // Remove Google Translate banner after load
  function hideGoogleTranslateBanner() {
    const interval = setInterval(() => {
      const banner = document.querySelector('.goog-te-banner-frame');
      if (banner) {
        banner.style.display = 'none';
        document.body.style.top = '0px';
        clearInterval(interval);
      }
    }, 1000);
  }
  window.addEventListener('load', hideGoogleTranslateBanner);
</script>
  </body>
