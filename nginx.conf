server {
    listen 80;
    server_name vms.194.62.99.202.sslip.io;

    location / {
        root /usr/share/nginx/html;  # Path to your React app
        try_files $uri /index.html;   # Fallback to index.html for unmatched routes
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;  # Ensure static files are served from the same directory
    }

    error_page 404 /index.html; 
    error_page 500 502 503 504 /index.html;
}
